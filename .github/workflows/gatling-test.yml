
name: Gatling Performance Test

'on':
  workflow_dispatch:

jobs:
  performance_test:
    name: Run Gatling on GCP
    runs-on: self-hosted
    timeout-minutes: 15

    defaults:
      run:
        working-directory: gatling

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Maven
        run: mvn -version

      - name: Run Gatling
        run: mvn -B gatling:test

      - name: Upload Gatling report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatling-report
          path: gatling/target/gatling/
          if-no-files-found: warn
          retention-days: 7
